<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EngageBot Testing Dashboard</title>
    <style>
        :root {
            --primary: #3b82f6;
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --user-msg: #3b82f6;
            --bot-msg: #334155;
            --success: #10b981;
            --warning: #f59e0b;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            display: flex;
            width: 100%;
        }

        .chat-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border);
        }

        .chat-header {
            padding: 20px;
            background-color: var(--panel-bg);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
        }

        .message.user {
            align-self: flex-end;
            background-color: var(--user-msg);
            border-bottom-right-radius: 4px;
        }

        .message.bot {
            align-self: flex-start;
            background-color: var(--bot-msg);
            border-bottom-left-radius: 4px;
        }

        .input-area {
            padding: 20px;
            background-color: var(--panel-bg);
            border-top: 1px solid var(--border);
            display: flex;
            gap: 12px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background-color: var(--bg-color);
            color: var(--text-main);
            outline: none;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            background-color: var(--primary);
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }
        
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .debug-section {
            width: 400px;
            background-color: var(--panel-bg);
            display: flex;
            flex-direction: column;
        }

        .debug-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            font-weight: 600;
            color: var(--success);
        }

        .debug-content {
            padding: 20px;
            overflow-y: auto;
            flex: 1;
        }

        pre {
            background-color: var(--bg-color);
            padding: 16px;
            border-radius: 8px;
            overflow-x: auto;
            font-size: 13px;
            color: #a5b4fc;
            margin: 0;
            border: 1px solid var(--border);
        }
        
        .section-title {
            margin-top: 20px;
            margin-bottom: 8px;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
        }

        .loader {
            align-self: flex-start;
            display: none;
            padding: 12px 16px;
            background-color: var(--bot-msg);
            border-radius: 12px;
            color: var(--text-muted);
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="chat-section">
            <div class="chat-header">
                <h2>Patient Check-in Bot</h2>
                <button id="resetBtn" style="background-color: var(--border);">Restart Session</button>
            </div>
            <div class="chat-messages" id="chatArea">
                <div class="message bot">Hello! I'm the check-in bot. Click 'Restart Session' or type a message to begin.</div>
            </div>
            <div class="loader" id="loader">Bot is typing...</div>
            <div class="input-area">
                <input type="text" id="msgInput" placeholder="Type a message..." onkeypress="handleKeyPress(event)">
                <button id="sendBtn" onclick="sendMessage()">Send</button>
            </div>
        </div>
        <div class="debug-section">
            <div class="debug-header">
                Real-Time State & AI Detail
            </div>
            <div class="debug-content">
                <div class="section-title">Tone Assessment</div>
                <pre id="toneData">Waiting for message...</pre>
                
                <div class="section-title">Internal State</div>
                <pre id="stateData">Waiting for message...</pre>
            </div>
        </div>
    </div>

    <script>
        let sessionId = 'test-session-' + Date.now();
        const chatArea = document.getElementById('chatArea');
        const msgInput = document.getElementById('msgInput');
        const sendBtn = document.getElementById('sendBtn');
        const loader = document.getElementById('loader');
        const toneData = document.getElementById('toneData');
        const stateData = document.getElementById('stateData');
        
        async function startSession() {
            addMessage('System', 'Starting new session...', 'bot');
            try {
                const res = await fetch('/api/session', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ sessionId })
                });
                if (res.ok) {
                    addMessage('Bot', 'Session created! I am ready to check you in. Say hi!', 'bot');
                } else {
                    addMessage('System', 'Failed to create session.', 'bot');
                }
            } catch (err) {
                console.error(err);
            }
        }

        document.getElementById('resetBtn').addEventListener('click', () => {
            sessionId = 'test-session-' + Date.now();
            chatArea.innerHTML = '';
            toneData.innerText = 'Waiting for message...';
            stateData.innerText = 'Waiting for message...';
            startSession();
        });

        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        }

        function addMessage(sender, text, type) {
            const div = document.createElement('div');
            div.className = `message ${type}`;
            div.textContent = text;
            chatArea.appendChild(div);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        async function sendMessage() {
            const text = msgInput.value.trim();
            if (!text) return;
            
            addMessage('You', text, 'user');
            msgInput.value = '';
            msgInput.disabled = true;
            sendBtn.disabled = true;
            loader.style.display = 'block';
            toneData.textContent = 'Analyzing...';
            stateData.textContent = 'Updating state...';
            chatArea.scrollTop = chatArea.scrollHeight;

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ sessionId, message: text })
                });
                const data = await res.json();
                
                if (data.error) {
                    addMessage('Error', data.error, 'bot');
                    toneData.textContent = 'Error occurred';
                    stateData.textContent = 'Error occurred';
                } else {
                    addMessage('Bot', data.reply, 'bot');
                    
                    if (data.toneAssessment) {
                        toneData.textContent = JSON.stringify(data.toneAssessment, null, 2);
                    } else {
                        toneData.textContent = 'Session Complete (No Tone Assessment)';
                    }
                    if (data.debugState) {
                        stateData.textContent = JSON.stringify({
                            isComplete: data.isComplete,
                            emergency: data.emergency,
                            ...data.debugState
                        }, null, 2);
                    } else {
                        stateData.textContent = 'No State Data';
                    }
                }
            } catch (err) {
                addMessage('Error', err.message, 'bot');
            } finally {
                msgInput.disabled = false;
                sendBtn.disabled = false;
                loader.style.display = 'none';
                msgInput.focus();
                chatArea.scrollTop = chatArea.scrollHeight;
            }
        }

        // Start session on load
        startSession();
    </script>
</body>
</html>
